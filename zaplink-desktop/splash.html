<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #020617;
    --accent: #10b981;
    --text: #f8fafc;
  }
  body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; font-family: 'Inter', -apple-system, sans-serif;
    overflow: hidden; -webkit-app-region: drag;
  }
  .aurora {
    position: absolute; width: 300px; height: 300px; background: var(--accent);
    filter: blur(100px); opacity: 0.15; border-radius: 50%;
    animation: pulse 4s infinite alternate;
  }
  @keyframes pulse { from { transform: scale(1); opacity: 0.1; } to { transform: scale(1.5); opacity: 0.25; } }

  .logo-box { position: relative; display: flex; flex-direction: column; align-items: center; gap: 24px; z-index: 10; }
  .logo-icon { font-size: 64px; filter: drop-shadow(0 0 20px var(--accent)); }
  .title { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin: 0; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .status { font-size: 12px; color: #94a3b8; font-weight: 500; text-transform: uppercase; letter-spacing: 2px; margin-top: 10px; }
  
  .loader {
    width: 200px; height: 4px; background: rgba(255,255,255,0.05);
    border-radius: 2px; margin-top: 32px; overflow: hidden; position: relative;
  }
  .loader-fill {
    position: absolute; height: 100%; width: 50%; background: var(--accent);
    border-radius: 2px; animation: loading 1.5s infinite ease-in-out;
  }
  @keyframes loading {
    0% { left: -50%; }
    100% { left: 100%; }
  }
  .footer { position: absolute; bottom: 24px; font-size: 10px; color: #475569; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="aurora"></div>
  <div class="logo-box">
    <div class="logo-icon">🚀</div>
    <h1 class="title">ZAPLINK</h1>
    <div class="status">Iniciando sistema...</div>
    <div class="loader"><div class="loader-fill"></div></div>
  </div>
  <div class="footer">SPLINKAPP · TECNOLOGIA PARA DISPAROS</div>
</body>
</html>

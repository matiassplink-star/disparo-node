version: '3.8'

services:
  zaplink-node:
    build: .
    container_name: zaplink-node
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./sessoes:/app/sessoes
      - ./logs:/app/logs
      - ./contatos:/app/contatos
      - ./midia:/app/midia
    # Garante que o Chrome tenha memória compartilhada suficiente
    shm_size: '2gb'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    mem_limit: 3g
